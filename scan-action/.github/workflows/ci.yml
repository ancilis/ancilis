name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (type check)
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build dist
        run: npm run package

      - name: Verify dist is committed
        run: |
          if ! git diff --exit-code dist/index.js; then
            echo "dist/index.js is out of date. Run 'npm run package' and commit."
            exit 1
          fi
