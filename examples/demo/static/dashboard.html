<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ancilis — Evidence Dashboard</title>
  <style>
    :root {
      --bg:       #0d1117;
      --bg2:      #161b22;
      --bg3:      #21262d;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --accent:   #58a6ff;
      --green:    #3fb950;
      --red:      #f85149;
      --yellow:   #d29922;
      --mono:     "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    header .badge {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      padding: 2px 8px;
      color: var(--muted);
      font-family: var(--mono);
    }
    header .refresh-indicator {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
    }
    header .refresh-indicator span {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Layout ── */
    main { max-width: 1280px; margin: 0 auto; padding: 24px; }

    /* ── Stat Cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
    }
    .card .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .card .value {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }
    .card .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
    .value.green { color: var(--green); }
    .value.red   { color: var(--red); }
    .value.yellow { color: var(--yellow); }
    .value.blue  { color: var(--accent); }

    /* ── Chain Status ── */
    .chain-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid;
      margin-bottom: 24px;
      font-family: var(--mono);
      font-size: 13px;
    }
    .chain-banner.valid   { background: rgba(63,185,80,.08); border-color: var(--green); color: var(--green); }
    .chain-banner.invalid { background: rgba(248,81,73,.08);  border-color: var(--red);   color: var(--red); }
    .chain-banner .icon { font-size: 16px; }

    /* ── Dual-column section ── */
    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 740px) { .row2 { grid-template-columns: 1fr; } }

    .section-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
    }
    .section-card h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Decision bar ── */
    .decision-list { list-style: none; }
    .decision-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .decision-list .key {
      font-family: var(--mono);
      font-size: 12px;
      min-width: 56px;
      padding: 2px 6px;
      border-radius: 4px;
      text-align: center;
      font-weight: 600;
    }
    .key.ALLOW  { background: rgba(63,185,80,.15); color: var(--green); }
    .key.DENY   { background: rgba(248,81,73,.15);  color: var(--red); }
    .key.FLAG   { background: rgba(210,153,34,.15); color: var(--yellow); }
    .key.AUDIT  { background: rgba(88,166,255,.15); color: var(--accent); }
    .decision-list .bar-wrap { flex: 1; background: var(--bg3); border-radius: 4px; height: 6px; }
    .decision-list .bar      { height: 6px; border-radius: 4px; min-width: 2px; }
    .bar.ALLOW { background: var(--green); }
    .bar.DENY  { background: var(--red); }
    .bar.FLAG  { background: var(--yellow); }
    .bar.AUDIT { background: var(--accent); }
    .decision-list .count { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 28px; text-align: right; }

    /* ── Control pass rates ── */
    .control-table { width: 100%; border-collapse: collapse; }
    .control-table td { padding: 6px 4px; font-size: 13px; border-bottom: 1px solid var(--bg3); }
    .control-table td:first-child { font-family: var(--mono); color: var(--accent); font-size: 12px; }
    .control-table td:last-child { text-align: right; font-family: var(--mono); font-size: 12px; }
    .pct.ok   { color: var(--green); }
    .pct.warn { color: var(--yellow); }
    .pct.fail { color: var(--red); }

    /* ── Evidence Table ── */
    .table-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .table-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .table-header h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .table-header .count-badge {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
    }
    .table-wrap { overflow-x: auto; }
    table.evidence {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.evidence th {
      background: var(--bg3);
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 8px 14px;
      text-align: left;
      white-space: nowrap;
    }
    table.evidence td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--bg3);
      vertical-align: top;
      white-space: nowrap;
    }
    table.evidence tr:last-child td { border-bottom: none; }
    table.evidence tr:hover td { background: var(--bg3); }
    .mono { font-family: var(--mono); }
    .decision-chip {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .decision-chip.ALLOW  { background: rgba(63,185,80,.15);  color: var(--green); }
    .decision-chip.DENY   { background: rgba(248,81,73,.15);   color: var(--red); }
    .decision-chip.FLAG   { background: rgba(210,153,34,.15);  color: var(--yellow); }
    .decision-chip.AUDIT  { background: rgba(88,166,255,.15);  color: var(--accent); }
    .controls-cell {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 280px;
    }
    .ctrl-tag {
      font-family: var(--mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }
    .ctrl-tag.pass { border-color: var(--green); color: var(--green); background: rgba(63,185,80,.07); }
    .ctrl-tag.fail { border-color: var(--red);   color: var(--red);   background: rgba(248,81,73,.07); }

    /* ── Empty / Loading ── */
    .empty { padding: 48px; text-align: center; color: var(--muted); }
    .empty .icon { font-size: 36px; margin-bottom: 12px; }
    .error-banner {
      background: rgba(248,81,73,.08);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      color: var(--red);
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">ancilis</div>
  <div class="badge">evidence dashboard</div>
  <div class="refresh-indicator"><span></span>live · refreshes every 5s</div>
</header>

<main>
  <div id="error-banner" class="error-banner" style="display:none"></div>

  <!-- Chain integrity -->
  <div id="chain-banner" class="chain-banner valid" style="display:none">
    <span class="icon">🔗</span>
    <span id="chain-text"></span>
  </div>

  <!-- Stat cards -->
  <div class="stats-grid" id="stats-grid">
    <div class="card"><div class="label">Total Evaluations</div><div class="value blue" id="stat-total">—</div></div>
    <div class="card"><div class="label">Allowed</div><div class="value green" id="stat-allow">—</div></div>
    <div class="card"><div class="label">Denied</div><div class="value red" id="stat-deny">—</div></div>
    <div class="card"><div class="label">Flagged</div><div class="value yellow" id="stat-flag">—</div></div>
  </div>

  <!-- Decisions + Controls -->
  <div class="row2">
    <div class="section-card">
      <h2>Decision Breakdown</h2>
      <ul class="decision-list" id="decision-list"><li style="color:var(--muted)">Loading…</li></ul>
    </div>
    <div class="section-card">
      <h2>Control Pass Rates</h2>
      <table class="control-table" id="control-table">
        <tbody><tr><td colspan="2" style="color:var(--muted)">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Evidence table -->
  <div class="table-card">
    <div class="table-header">
      <h2>Evidence Records</h2>
      <span class="count-badge" id="record-count">—</span>
    </div>
    <div class="table-wrap">
      <table class="evidence">
        <thead>
          <tr>
            <th>#</th>
            <th>Timestamp</th>
            <th>Agent</th>
            <th>Tool</th>
            <th>Decision</th>
            <th>Controls</th>
          </tr>
        </thead>
        <tbody id="evidence-body">
          <tr><td colspan="6" class="empty"><div class="icon">⏳</div><div>Loading evidence…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
  const API = '';  // same origin

  function fmtTs(ts) {
    if (!ts) return '—';
    try {
      const d = new Date(ts);
      return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    } catch { return ts; }
  }

  function decisionChip(d) {
    const v = (d || 'UNKNOWN').toUpperCase();
    return `<span class="decision-chip ${v}">${v}</span>`;
  }

  function renderSummary(s) {
    document.getElementById('stat-total').textContent = s.total_evaluations ?? 0;
    const dec = s.decisions || {};
    document.getElementById('stat-allow').textContent = dec.ALLOW ?? dec.allow ?? 0;
    document.getElementById('stat-deny').textContent  = dec.DENY  ?? dec.deny  ?? 0;
    document.getElementById('stat-flag').textContent  = dec.FLAG  ?? dec.flag  ?? 0;

    // Chain banner
    const banner = document.getElementById('chain-banner');
    const text   = document.getElementById('chain-text');
    banner.style.display = 'flex';
    if (s.chain_valid) {
      banner.className = 'chain-banner valid';
      text.textContent = 'Evidence chain integrity: VALID — all hashes verified';
    } else {
      banner.className = 'chain-banner invalid';
      const errs = (s.chain_errors || []).join('; ');
      text.textContent = `Evidence chain integrity: INVALID — ${errs || 'hash mismatch detected'}`;
    }

    // Decision list
    const total = s.total_evaluations || 1;
    const dl = document.getElementById('decision-list');
    const ORDER = ['ALLOW','DENY','FLAG','AUDIT'];
    const entries = Object.entries(dec).sort((a,b) => {
      const ai = ORDER.indexOf(a[0].toUpperCase()), bi = ORDER.indexOf(b[0].toUpperCase());
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
    if (entries.length === 0) {
      dl.innerHTML = '<li style="color:var(--muted);font-size:13px">No evaluations yet</li>';
    } else {
      dl.innerHTML = entries.map(([k, v]) => {
        const key = k.toUpperCase();
        const pct = Math.round((v / total) * 100);
        return `<li>
          <span class="key ${key}">${key}</span>
          <div class="bar-wrap"><div class="bar ${key}" style="width:${pct}%"></div></div>
          <span class="count">${v}</span>
        </li>`;
      }).join('');
    }

    // Control pass rates
    const rates = s.control_pass_rates || {};
    const tbody = document.querySelector('#control-table tbody');
    const rateEntries = Object.entries(rates).sort((a,b) => a[0].localeCompare(b[0]));
    if (rateEntries.length === 0) {
      tbody.innerHTML = '<tr><td colspan="2" style="color:var(--muted)">No control data</td></tr>';
    } else {
      tbody.innerHTML = rateEntries.map(([ctrl, rate]) => {
        // `rate` is a dict of result counts (e.g. {PASS: 3, SKIP: 2}), not a
        // scalar. Rate PASS over evaluated (non-SKIP) results only; SKIP means
        // "no evaluator ran", not "passed".
        const counts = {};
        for (const [k, v] of Object.entries(rate && typeof rate === 'object' ? rate : {})) {
          counts[k.toUpperCase()] = (counts[k.toUpperCase()] || 0) + Number(v || 0);
        }
        const totalResults = Object.values(counts).reduce((a, b) => a + b, 0);
        const evaluated = totalResults - (counts.SKIP || 0);
        if (evaluated === 0) {
          return `<tr>
            <td>${ctrl}</td>
            <td><span class="pct warn">Pending</span></td>
          </tr>`;
        }
        const pct = Math.round(((counts.PASS || 0) / evaluated) * 100);
        const cls = pct >= 90 ? 'ok' : pct >= 60 ? 'warn' : 'fail';
        return `<tr>
          <td>${ctrl}</td>
          <td><span class="pct ${cls}">${pct}%</span></td>
        </tr>`;
      }).join('');
    }
  }

  function renderRecords(records) {
    document.getElementById('record-count').textContent = `${records.length} records`;
    const tbody = document.getElementById('evidence-body');
    if (!records.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty"><div class="icon">📭</div><div>No evidence records yet</div></div></td></tr>';
      return;
    }
    tbody.innerHTML = records.map((r, i) => {
      const results = r.control_results || {};
      const ctrlTags = Object.entries(results).map(([id, res]) => {
        const passed = res === true || res === 'pass' || (typeof res === 'object' && res?.passed);
        return `<span class="ctrl-tag ${passed ? 'pass' : 'fail'}">${id}</span>`;
      }).join('');
      const agentShort = (r.agent_id || '—').split('/').pop().replace(/-[a-f0-9]{8}.*$/, '…');
      const toolName = r.tool_name || '—';
      return `<tr>
        <td class="mono" style="color:var(--muted)">${r.seq_id ?? (i+1)}</td>
        <td class="mono" style="color:var(--muted)">${fmtTs(r.timestamp)}</td>
        <td class="mono" title="${r.agent_id || ''}">${agentShort}</td>
        <td class="mono">${toolName}</td>
        <td>${decisionChip(r.decision)}</td>
        <td><div class="controls-cell">${ctrlTags || '<span style="color:var(--muted)">—</span>'}</div></td>
      </tr>`;
    }).join('');
  }

  async function refresh() {
    try {
      const [sumRes, recRes] = await Promise.all([
        fetch(`${API}/v1/evidence/summary`),
        fetch(`${API}/v1/evidence`),
      ]);
      if (!sumRes.ok || !recRes.ok) throw new Error(`HTTP ${sumRes.status}/${recRes.status}`);
      const [summary, records] = await Promise.all([sumRes.json(), recRes.json()]);

      document.getElementById('error-banner').style.display = 'none';
      renderSummary(summary);
      renderRecords(Array.isArray(records) ? records : []);
    } catch (err) {
      const b = document.getElementById('error-banner');
      b.style.display = 'block';
      b.textContent = `Failed to load evidence data: ${err.message}`;
    }
  }

  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
