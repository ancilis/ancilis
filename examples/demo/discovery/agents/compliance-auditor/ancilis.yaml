agent:
  name: compliance-auditor
  description: Framework-based compliance agent reviewing claims, medical record access, and exceptions
  owner: compliance-team
my_agent_handles:
  - health_records
  - financial_records
  - personal_info
certification_targets:
  - aiuc-1
security:
  mode: enforce
  tools:
    allowed:
      - review_claim_exception
      - verify_member_consent
      - inspect_access_log
      - generate_audit_packet
      - check_retention_policy
    blocked:
      - disable_retention_policy
