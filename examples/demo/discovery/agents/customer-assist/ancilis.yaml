agent:
  name: customer-assist
  description: HTTP support copilot that calls CRM, billing, and patient-support APIs
  owner: support-team
my_agent_handles:
  - health_records
  - personal_info
  - credit_cards
certification_targets:
  - aiuc-1
security:
  mode: enforce
  tools:
    allowed:
      - lookup_customer
      - check_balance
      - get_transactions
      - create_support_ticket
      - update_contact_info
      - lookup_credit_score
    blocked:
      - transfer_funds
      - close_account
