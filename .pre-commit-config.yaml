# Pre-commit hooks for ancilis/ancilis. Installed via `./scripts/setup-dev.sh`.
# CI re-runs equivalent checks; do NOT bypass with --no-verify.
# All third-party hooks pinned to commit SHAs (not tags) per SDLC mandate D1+D3.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 2c9f875913ee60ca25ce70243dc24d5b6415598c  # v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: forbid-submodules

  - repo: https://github.com/gitleaks/gitleaks
    rev: 43fae355e6fe4d99d2a7b240a224b85e2903aeb4  # v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: forbid-agent-state-files
        name: Forbid agent/IDE local state files
        entry: scripts/hooks/forbid-agent-state.sh
        language: script
        pass_filenames: true

      - id: forbid-dev-paths
        name: Forbid hardcoded dev paths
        entry: scripts/hooks/forbid-dev-paths.sh
        language: script
        types: [text]
        exclude: '^(\.gitignore|.*\.lock|.*node_modules.*|.*test.*fixtures.*|docs/.*examples.*|CHANGELOG\.md)$'

      - id: forbid-username-leak
        name: Forbid hardcoded usernames
        entry: scripts/hooks/forbid-username-leak.sh
        language: script
        types: [text]
        exclude: '^(.*\.lock|CHANGELOG\.md|.*test.*fixtures.*)$'
