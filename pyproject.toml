[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ancilis"
version = "0.1.0"
description = "Python-first runtime evaluation and policy enforcement for AI agent tool calls"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ai", "agent", "security", "policy", "compliance", "evidence", "mcp", "runtime"]
authors = [
    { name = "Kevin Bauer", email = "kevin@ancilis.ai" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "mcp>=1.0.0",
    "packaging>=23.0",
    "jsonschema>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
watch = [
    "watchdog>=4.0",
    "pathspec>=0.12",
]
testing = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "jsonschema>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "watchdog>=4.0",
    "pathspec>=0.12",
]

[project.scripts]
ancilis = "ancilis.cli.main:cli"
ancilis-cover = "ancilis.mcp_server.cover.server:main"

[project.entry-points."pytest11"]
ancilis = "ancilis.testing.plugin"

[project.urls]
Homepage = "https://ancilis.ai"
Repository = "https://github.com/ancilis/ancilis"
Documentation = "https://ancilis.ai/docs"
Issues = "https://github.com/ancilis/ancilis/issues"
Changelog = "https://github.com/ancilis/ancilis/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["python/src/ancilis"]

[tool.hatch.build.targets.wheel.force-include]
"shared" = "ancilis/shared"

[tool.hatch.build.targets.wheel.sources]
"python/src" = ""

[tool.hatch.build.targets.sdist]
include = [
    "/python/src/ancilis",
    "/python/tests",
    "/shared",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "F401", "F841", "I001", "UP012"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "--import-mode=importlib"
python_files = ["test_*.py", "bench_*.py"]

[tool.mypy]
python_version = "3.10"
strict = true
