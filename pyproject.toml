[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ancilis"
version = "0.1.0"
description = "Runtime evaluation and policy enforcement for AI agent tool calls"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Kevin Bauer", email = "kevin.e.bauer@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ancilis = "ancilis.cli.main:cli"

[project.urls]
Homepage = "https://github.com/kevbauer/ancilis"
Repository = "https://github.com/kevbauer/ancilis"
Documentation = "https://github.com/kevbauer/ancilis/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["python/src/ancilis"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "F401", "F841", "I001", "UP012"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
