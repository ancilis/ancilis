name: npm Preview Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-typescript-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run pack:smoke
