name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check python/src python/tests
      - name: Type check
        run: mypy python/src/ancilis --ignore-missing-imports
      - name: Test with coverage
        run: pytest python/tests -v --tb=short --cov=ancilis --cov-report=term-missing --cov-fail-under=80

  python-packaging:
    name: Python packaging verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Release check
        run: python scripts/release_check.py

  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Preview package smoke test
        run: npm run pack:smoke

  typescript-examples:
    name: TypeScript examples
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Build SDK tarball
        run: |
          npm ci --include=dev
          npm run build
          npm pack
          PKG_VERSION=$(node -p "require('./package.json').version")
          test -f "ancilis-${PKG_VERSION}.tgz"
      - name: minimal-quickstart-ts — setup
        run: npm install --include=dev
        working-directory: examples/typescript/minimal-quickstart-ts
      - name: minimal-quickstart-ts — run
        run: npx tsx index.ts
        working-directory: examples/typescript/minimal-quickstart-ts
      - name: minimal-quickstart-ts — scan score
        run: |
          OUT=$(npx ancilis scan --ci --config ancilis.yaml 2>&1 || true)
          echo "$OUT"
          PASSING=$(echo "$OUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['summary']['passing'])" 2>/dev/null || echo 0)
          TOTAL=$(echo "$OUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['summary']['total_controls'])" 2>/dev/null || echo 1)
          SCORE=$(python3 -c "print(int($PASSING/$TOTAL*100))")
          echo "Score: $SCORE% ($PASSING/$TOTAL)"
          test "$SCORE" -ge 70
        working-directory: examples/typescript/minimal-quickstart-ts
      - name: langchain-ts-chatbot — setup
        run: npm install --include=dev
        working-directory: examples/typescript/langchain-ts-chatbot
      - name: langchain-ts-chatbot — run
        run: npx tsx index.ts
        working-directory: examples/typescript/langchain-ts-chatbot
      - name: langchain-ts-chatbot — scan score
        run: |
          OUT=$(npx ancilis scan --ci --config ancilis.yaml 2>&1 || true)
          echo "$OUT"
          PASSING=$(echo "$OUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['summary']['passing'])" 2>/dev/null || echo 0)
          TOTAL=$(echo "$OUT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['summary']['total_controls'])" 2>/dev/null || echo 1)
          SCORE=$(python3 -c "print(int($PASSING/$TOTAL*100))")
          echo "Score: $SCORE% ($PASSING/$TOTAL)"
          test "$SCORE" -ge 70
        working-directory: examples/typescript/langchain-ts-chatbot

  docs-lint:
    name: Docs lint (counts + hype)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Control/overlay count lint
        run: python scripts/check_doc_counts.py
      - name: Hype lint
        run: python scripts/check_hype.py

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pip-audit
      - name: Python audit
        run: npm run security:audit:python-lock
      - name: Install root Node dependencies
        run: npm ci --include=dev
      - name: Root TypeScript SDK audit
        run: npm run security:audit:npm
      - name: Install scan-action dependencies
        run: npm ci --include=dev
        working-directory: scan-action
      - name: scan-action audit
        run: npm run security:audit
        working-directory: scan-action
