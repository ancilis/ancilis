name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-lates
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Lint (ruff)
        run: ruff check python/src python/tests
      - name: Type check (mypy)
        run: mypy python/src/ancilis --ignore-missing-imports
      - name: Test (pytest)
        run: pytest python/tests/ -v --tb=short

  typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check (tsc)
        run: npx tsc --noEmit
      - name: Test (vitest)
        run: npx vitest run

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: |
          python -mpip install --upgrade pip
          pip install -e ".[dev,mcp]"
          pip install pip-audit
      - name: Python audit (pip-audit)
        run: pip-audit --desc --skip-editable
      - name: Install Node dependencies
        run: npm ci
      - name: Node audit (npm audit)
        run: npm audit --audit-level=high
