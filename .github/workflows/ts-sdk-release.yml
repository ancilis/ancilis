name: TypeScript SDK Release

# Legacy ts-v tags remain verification-only. Both registries publish from v tags
# through release-python.yml and the sole npm publisher release-typescript.yml.
# No publishing credentials are available in this workflow.

permissions:
  contents: read

on:
  push:
    tags: ['ts-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compatibility input; this workflow always verifies only'
        type: boolean
        default: true

# ────────────────────────────────────────────────────────────────
# Job 1: BUILD
#   Compile, test, pack once, hash, upload as workflow artifact.
# ────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build & pack tarball
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ts-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Install root Node dependencies
        run: npm ci --include=dev

      - name: Root TypeScript SDK dependency audit
        run: npm run security:audit:npm

      - name: Install scan-action dependencies
        run: npm ci --include=dev
        working-directory: scan-action

      - name: scan-action dependency audit
        run: npm run security:audit
        working-directory: scan-action

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack tarball
        id: pack
        run: |
          mkdir -p release-dist
          npm pack --json --pack-destination release-dist > release-dist/pack.json
          TARBALL=$(node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const [{ filename }] = JSON.parse(readFileSync('release-dist/pack.json', 'utf8'));
            console.log(filename);
          ")
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed: $TARBALL"

      - name: Compute SHA-256
        id: hash
        run: |
          cd release-dist
          sha256sum "${{ steps.pack.outputs.tarball }}" > SHA256SUMS
          echo "sha256=$(sha256sum "${{ steps.pack.outputs.tarball }}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "Checksum:"
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ts-sdk-tarball
          path: |
            release-dist/*.tgz
            release-dist/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

# ────────────────────────────────────────────────────────────────
# Job 2: VERIFY
#   Download the exact artifact, re-verify checksum, install from
#   tarball (not from source), run full smoke suite + TS type check.
# ────────────────────────────────────────────────────────────────
  verify:
    name: Verify artifact
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ts-sdk-tarball
          path: ./release-dist

      - name: Verify SHA-256 checksum
        run: |
          cd release-dist
          sha256sum -c SHA256SUMS
          echo "Checksum verified ✓"

      - name: Run smoke tests (install from tarball)
        run: |
          TARBALL=$(ls release-dist/*.tgz)
          bash typescript/scripts/smoke-test.sh "$TARBALL"

      - name: TypeScript type-check against installed package
        run: |
          TARBALL=$(ls release-dist/*.tgz)
          TSC_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/typescript'].version")
          NODE_TYPES_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@types/node'].version")
          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          cd "$VERIFY_DIR"
          npm init -y
          npm install "$OLDPWD/$TARBALL"
          npm install "typescript@$TSC_VERSION" "@types/node@$NODE_TYPES_VERSION"
          # Verify type exports compile under strict mode
          cat > check.mts <<'EOF'
          import type { Engine, AncilisMiddleware, EvidenceStore, ReportGenerator } from 'ancilis';
          import type { CLIActionProducer, HTTPActionProducer, ToolActionProducer } from 'ancilis';
          import type { BaselineManager } from 'ancilis';
          // If this file compiles, the .d.ts exports are correct
          const _: [Engine, AncilisMiddleware, EvidenceStore, ReportGenerator, CLIActionProducer, HTTPActionProducer, ToolActionProducer, BaselineManager] = undefined as any;
          EOF
          npx tsc --noEmit --strict --moduleResolution node16 --module node16 check.mts
          echo "TypeScript type check passed ✓"
          cd -
          rm -rf "$VERIFY_DIR"
