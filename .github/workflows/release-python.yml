name: Release Python

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify_python_release:
    name: Verify Python release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify cross-SDK version alignment
        run: |
          TS_VERSION=$(node -p "require('./package.json').version")
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TS_VERSION" != "$PY_VERSION" ]; then
            echo "::error::TypeScript ($TS_VERSION) and Python ($PY_VERSION) versions diverged"
            exit 1
          fi
      - name: Run local release check
        run: python scripts/release_check.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish_python:
    name: Publish Python package
    needs: verify_python_release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/ancilis
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
