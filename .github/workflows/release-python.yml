name: Release Python

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Serialize the sole publisher for each package/version; never cancel a publish.
concurrency:
  group: ancilis-python-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify_python_release:
    name: Verify Python release artifacts
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $PY_VERSION"
            exit 1
          fi
          echo "Version check passed: $PY_VERSION"
      - name: Verify cross-SDK version alignment
        run: |
          TS_VERSION=$(node -p "require('./package.json').version")
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TS_VERSION" != "$PY_VERSION" ]; then
            echo "::error::TypeScript ($TS_VERSION) and Python ($PY_VERSION) versions diverged"
            exit 1
          fi
      - name: Install Python audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Python requirements lock audit
        run: npm run security:audit:python-lock
      - name: Run local release check
        run: python scripts/release_check.py
      - name: Record candidate version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Select the two verified Python archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir python-release-artifacts
          cp "dist/ancilis-${VERSION}-py3-none-any.whl" "dist/ancilis-${VERSION}.tar.gz" python-release-artifacts/
      - name: Freeze archive inventory and build manifest digest
        id: manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release_manifest.py create --directory python-release-artifacts --kind python --version "$VERSION" --source "$GITHUB_SHA"
      - name: Upload exact verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: python-release-artifacts/
          if-no-files-found: error

  release_gate:
    name: Verify approved release commit
    # Configure protection before any tag push; the name alone grants no protection.
    environment:
      name: pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify merged source, reviews and required CI
        run: python scripts/release_gate.py --repository "$GITHUB_REPOSITORY" --source "$GITHUB_SHA" --output release-approval.json
        env:
          # Dedicated read-only credential also needs Administration:read.
          # Missing authorization or API visibility fails closed.
          RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-release-approval
          path: release-approval.json
          if-no-files-found: error

  publish_python:
    name: Publish Python package
    needs: [verify_python_release, release_gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      # Remote protection is a separate release prerequisite; a name is not a gate.
      name: pypi
      url: https://pypi.org/p/ancilis
    env:
      VERSION: ${{ needs.verify_python_release.outputs.version }}
      MANIFEST_SHA256: ${{ needs.verify_python_release.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: python-release-artifacts
      - name: Verify downloaded bytes and immutable registry state
        id: registry
        run: python scripts/release_manifest.py registry --directory python-release-artifacts --kind python --version "$VERSION" --source "$GITHUB_SHA" --digest "$MANIFEST_SHA256" --evidence registry-before.json
      - name: Select verified archives for PyPI
        if: steps.registry.outputs.state == 'absent'
        run: |
          mkdir publish-dist
          cp "python-release-artifacts/ancilis-${VERSION}-py3-none-any.whl" "python-release-artifacts/ancilis-${VERSION}.tar.gz" publish-dist/
          cp python-release-artifacts/release-manifest.json publish-dist/
          python scripts/release_manifest.py verify --directory publish-dist --kind python --version "$VERSION" --source "$GITHUB_SHA" --digest "$MANIFEST_SHA256"
          rm publish-dist/release-manifest.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.registry.outputs.state == 'absent'
        with:
          packages-dir: publish-dist/
          skip-existing: false
      - name: Verify registry contains these exact bytes
        run: python scripts/release_manifest.py registry --directory python-release-artifacts --kind python --version "$VERSION" --source "$GITHUB_SHA" --digest "$MANIFEST_SHA256" --require-identical --evidence registry-after.json
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-publication-evidence
          path: |
            registry-before.json
            registry-after.json
            python-release-artifacts/release-manifest.json
          if-no-files-found: error
