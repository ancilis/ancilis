name: Pipeline Auto Complete

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  update_on_merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Extract item slug from branch name
        id: extract_slug
        run: |
          # Extract slug from feature/item-name-slug -> item-name-slug
          BRANCH_NAME="${{ github.head_ref }}"

          # Check if branch matches feature/* pattern
          if [[ ! "$BRANCH_NAME" =~ ^feature/ ]]; then
            echo "Branch '$BRANCH_NAME' does not match feature/* pattern. Skipping Notion update."
            exit 0
          fi

          SLUG="${BRANCH_NAME#feature/}"
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "Extracted slug: $SLUG"

      - name: Update Notion - Phase to MERGED
        if: steps.extract_slug.outputs.slug != ''
        run: |
          ITEM_SLUG="${{ steps.extract_slug.outputs.slug }}"
          NOTION_API_KEY="${{ secrets.NOTION_API_KEY }}"
          DATABASE_ID="${{ secrets.NOTION_DATABASE_ID }}"

          if [ -z "$ITEM_SLUG" ]; then
            echo "No item slug extracted. Skipping Notion update."
            exit 0
          fi

          # Search for item by Branch field in database
          BRANCH_FULL="feature/$ITEM_SLUG"
          SEARCH_RESPONSE=$(curl -s -X POST \
            "https://api.notion.com/v1/databases/$DATABASE_ID/query" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{
              "filter": {
                "property": "Branch",
                "rich_text": {
                  "equals": "'"$BRANCH_FULL"'"
                }
              }
            }')

          # Extract page ID from search results
          PAGE_ID=$(echo "$SEARCH_RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          if [ -z "$PAGE_ID" ]; then
            echo "Warning: Could not find item with slug '$ITEM_SLUG' in Notion database"
            exit 0
          fi

          echo "Found item with ID: $PAGE_ID"

          # Update Phase to MERGED and Owner to System
          curl -s -X PATCH \
            "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{
              "properties": {
                "Phase": {
                  "select": {
                    "name": "MERGED"
                  }
                },
                "Owner": {
                  "select": {
                    "name": "System"
                  }
                }
              }
            }' | grep -q '"id"' && echo "Successfully updated Notion item to Phase=MERGED, Owner=System" || echo "Warning: Failed to update Notion item"
