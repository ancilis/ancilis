name: Release TypeScript

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify_typescript_release:
    name: Verify TypeScript release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version-tag alignment
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Verify cross-SDK version alignment
        run: |
          TS_VERSION=$(node -p "require('./package.json').version")
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TS_VERSION" != "$PY_VERSION" ]; then
            echo "::error::TypeScript ($TS_VERSION) and Python ($PY_VERSION) versions diverged"
            exit 1
          fi
      - run: npm ci
      - run: npx vitest run
      - name: Pack verified tarball
        run: |
          mkdir -p release-artifacts
          npm pack --json --pack-destination release-artifacts > release-artifacts/pack.json
      - name: Smoke test verified tarball
        run: |
          TARBALL=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const [{ filename }] = JSON.parse(readFileSync('release-artifacts/pack.json', 'utf8')); console.log(filename);")
          node scripts/ts_package_smoke.mjs "release-artifacts/$TARBALL"
      - name: Compute SHA-256 hash
        id: hash
        run: |
          TARBALL=$(ls release-artifacts/*.tgz)
          (cd release-artifacts && sha256sum "$(basename "$TARBALL")") > release-artifacts/SHA256SUMS
          echo "sha256=$(sha256sum "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cat release-artifacts/SHA256SUMS
      - name: Dry-run publish
        run: npm publish release-artifacts/*.tgz --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ancilis-typescript-package
          path: |
            release-artifacts/*.tgz
            release-artifacts/pack.json
            release-artifacts/SHA256SUMS

  publish_typescript:
    name: Publish TypeScript package
    needs: verify_typescript_release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/ancilis
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: ancilis-typescript-package
          path: release-artifacts
      - name: Verify SHA-256 integrity
        run: |
          cd release-artifacts
          sha256sum -c SHA256SUMS
          echo "Tarball integrity verified"
      - run: npm publish release-artifacts/*.tgz --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.tgz
            release-artifacts/SHA256SUMS
          generate_release_notes: true
