name: Release TypeScript

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Serialize the sole publisher for each package/version; never cancel a publish.
concurrency:
  group: ancilis-typescript-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify_typescript_release:
    name: Verify TypeScript release artifacts
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Verify version-tag alignment
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Verify cross-SDK version alignment
        run: |
          TS_VERSION=$(node -p "require('./package.json').version")
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TS_VERSION" != "$PY_VERSION" ]; then
            echo "::error::TypeScript ($TS_VERSION) and Python ($PY_VERSION) versions diverged"
            exit 1
          fi
      - name: Install root Node dependencies
        run: npm ci --include=dev
      - name: Root TypeScript SDK dependency audit
        run: npm run security:audit:npm
      - name: Install scan-action dependencies
        run: npm ci --include=dev
        working-directory: scan-action
      - name: scan-action dependency audit
        run: npm run security:audit
        working-directory: scan-action
      - run: npx vitest run
      - name: Build the TypeScript package
        run: npm run build
      - name: Pack verified tarball
        run: |
          mkdir -p release-artifacts
          npm pack --ignore-scripts --json --pack-destination release-artifacts > release-artifacts/pack.json
      - name: Smoke test verified tarball
        run: |
          TARBALL=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const [{ filename }] = JSON.parse(readFileSync('release-artifacts/pack.json', 'utf8')); console.log(filename);")
          node scripts/ts_package_smoke.mjs "release-artifacts/$TARBALL"
      - name: Record candidate version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Retain pack diagnostic outside publication directory
        run: mv release-artifacts/pack.json pack-diagnostic.json
      - name: Dry-run the exact tarball without credentials or lifecycle scripts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm publish "release-artifacts/ancilis-${VERSION}.tgz" --dry-run --ignore-scripts
      - name: Freeze archive inventory and build manifest digest
        id: manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release_manifest.py create --directory release-artifacts --kind npm --version "$VERSION" --source "$GITHUB_SHA"
      - name: Upload exact verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ancilis-typescript-package
          path: release-artifacts/
          if-no-files-found: error

  release_gate:
    name: Verify approved release commit
    # Configure protection before any tag push; the name alone grants no protection.
    environment:
      name: npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify merged source, reviews and required CI
        run: python scripts/release_gate.py --repository "$GITHUB_REPOSITORY" --source "$GITHUB_SHA" --output release-approval.json
        env:
          # Dedicated read-only credential also needs Administration:read.
          # Missing authorization or API visibility fails closed.
          RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-release-approval
          path: release-approval.json
          if-no-files-found: error

  publish_typescript:
    name: Publish TypeScript package
    needs: [verify_typescript_release, release_gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      # Remote protection is a separate release prerequisite; a name is not a gate.
      name: npm
      url: https://www.npmjs.com/package/ancilis
    env:
      VERSION: ${{ needs.verify_typescript_release.outputs.version }}
      MANIFEST_SHA256: ${{ needs.verify_typescript_release.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ancilis-typescript-package
          path: release-artifacts
      - name: Verify downloaded bytes and immutable registry state
        id: registry
        run: python scripts/release_manifest.py registry --directory release-artifacts --kind npm --version "$VERSION" --source "$GITHUB_SHA" --digest "$MANIFEST_SHA256" --evidence registry-before.json
      - name: Publish the verified tarball with token authentication and provenance
        if: steps.registry.outputs.state == 'absent'
        run: npm publish "release-artifacts/ancilis-${VERSION}.tgz" --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry contains these exact bytes
        run: python scripts/release_manifest.py registry --directory release-artifacts --kind npm --version "$VERSION" --source "$GITHUB_SHA" --digest "$MANIFEST_SHA256" --require-identical --evidence registry-after.json
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-publication-evidence
          path: |
            registry-before.json
            registry-after.json
            release-artifacts/release-manifest.json
          if-no-files-found: error
