name: Debug secret
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "Length: ${#T}"
          echo "First 4 chars (will be masked):"
          echo "[${T:0:4}]"
          echo "Last 4 chars (will be masked):"
          echo "[${T: -4}]"
          # MD5 of token - safe to print (irreversible)
          echo "MD5: $(printf '%s' "$T" | md5sum | cut -d' ' -f1)"
          # Check for unexpected characters
          echo "Has whitespace: $(printf '%s' "$T" | grep -c '[[:space:]]' || echo 0)"
          echo "Starts with sk-ant-oat01-: $([ "${T:0:13}" = "sk-ant-oat01-" ] && echo yes || echo no)"
