name: Pipeline CI Verify

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract item slug from branch name
        id: extract_slug
        run: |
          # Extract slug from feature/item-name-slug -> item-name-slug
          BRANCH_NAME="${{ github.ref_name }}"
          SLUG="${BRANCH_NAME#feature/}"
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "Extracted slug: $SLUG"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Run pytest
        run: pytest python/tests/ -v

      - name: Run vitest
        run: npx vitest run

      - name: Update Notion - Phase to VERIFY
        if: success()
        run: |
          ITEM_SLUG="${{ steps.extract_slug.outputs.slug }}"
          NOTION_API_KEY="${{ secrets.NOTION_API_KEY }}"
          DATABASE_ID="${{ secrets.NOTION_DATABASE_ID }}"

          # Search for item by Branch field in database
          BRANCH_FULL="feature/$ITEM_SLUG"
          SEARCH_RESPONSE=$(curl -s -X POST \
            "https://api.notion.com/v1/databases/$DATABASE_ID/query" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{
              "filter": {
                "property": "Branch",
                "rich_text": {
                  "equals": "'"$BRANCH_FULL"'"
                }
              }
            }')

          # Extract page ID from search results
          PAGE_ID=$(echo "$SEARCH_RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          if [ -z "$PAGE_ID" ]; then
            echo "Warning: Could not find item with slug '$ITEM_SLUG' in Notion database"
            exit 0
          fi

          echo "Found item with ID: $PAGE_ID"

          # Update Phase to VERIFY and Owner to System
          curl -s -X PATCH \
            "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d '{
              "properties": {
                "Phase": {
                  "select": {
                    "name": "VERIFY"
                  }
                },
                "Owner": {
                  "select": {
                    "name": "System"
                  }
                }
              }
            }' | grep -q '"id"' && echo "Successfully updated Notion item to Phase=VERIFY, Owner=System" || echo "Warning: Failed to update Notion item"
